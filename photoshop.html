<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>Portfolio Works</title>
<link rel="icon" type="image/png" href="img/S_img.png">

<!-- Bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">

<style>
    /* SECTION TITLE */
    .web {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 20px;
    }

    /* CARD CONTAINER */
    .shadow {
        background: #fff;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 30px;
    }

    /* BUTTON RESET */
    button.btn {
        border: none;
        background: transparent;
        padding: 10px;
        width: 100%;
    }

    /* COMMON IMAGE STYLE (VERY IMPORTANT) */
    .temp1,
    .temp2,
    .temp3,
    .temp4,
    .mockupbb,
    .mockupcar {
        width: 100%;
        /* height: 300px;  SAME HEIGHT FOR ALL */
        object-fit: cover;
        /* KEEP IMAGE PROPORTION */
        border-radius: 12px;
        transition: 0.4s;
    }

    /* HOVER EFFECT (MODERN LOOK) */
    button:hover img {
        transform: scale(1.05);
    }

    /* ADD SHADOW TO IMAGES */
    .temp1,
    .temp2,
    .temp3,
    .temp4,
    .mockupbb,
    .mockupcar {
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    /* SPACING FIX */
    .row {
        margin-top: 20px;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {

        .temp1,
        .temp2,
        .temp3,
        .temp4,
        .mockupbb,
        .mockupcar {
            /* height: 200px; */
        }
    }
</style>

</head>

<div class="container-fluid mt-lg-5">
    <div class="shadow">
        <h1 class="web text-dark mt-lg-5 text-center ">Web templates</h1>

        <div class="row ">
            <div class="col-lg-6">
                <button class="btn btn"> <img src="img/photoshop/BB WEB TEMP1.png" class="temp1"> </button>
            </div>

            <div class="col-lg-6 ">
                <button class="btn btn "> <img src="img/photoshop/BB WEB TEMP2.png" class="temp2"> </button>
            </div>
        </div>
    </div>

    <!------------------------------->

    <div class="row shadow">
        <div class="col-lg-6 ">
            <button class="btn btn mt-lg-5"> <img src="img/photoshop/car full website.png" class="temp3"> </button>
        </div>

        <div class="col-lg-6 ">
            <button class="btn btn  mt-lg-5"> <img src="img/photoshop/pearly web temp png.png " class="temp4"></button>
        </div>
    </div>



    <!---------------- MOCK UPS  --------------->

    <div class="row p-5 ">
        <div class="col-lg-6">
            <button class="btn btn text-center  ml-lg-2"> <img src="img/photoshop/bb contrctn mockup png.png" alt=""
                    class="mockupbb "> </button>
        </div>


        <div class="col-lg-6">
            <button class="btn btn text-center  ml-lg-2"> <img src="img/photoshop/car template mockup.png" alt=""
                    class=" mockupcar"> </button>
        </div>
    </div>
</div>


</body>

</html>
